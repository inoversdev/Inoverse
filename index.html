<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Inovers Tech Solutions — Custom software, systems, and technology solutions to help your business thrive in the digital age." />
    <meta name="theme-color" content="#FFFFFF" />
    <title>Inovers Tech Solutions</title>

    <!-- Social sharing (2026-08-11, pre-launch): without OG tags, links
         shared on Messenger/FB/Twitter render as bare URLs. og:url must
         be updated to the FINAL production domain before launch. TODO:
         og:image — generate a 1200x630 share card once the designers'
         assets land (a missing image still shares fine, just plainer). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Inovers Tech Solutions" />
    <meta property="og:title" content="Inovers Tech Solutions — Innovating the Future, Together" />
    <meta property="og:description" content="Custom software, systems, and technology solutions to help your business thrive in the digital age." />
    <meta property="og:url" content="https://inovers.dev/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Inovers Tech Solutions — Innovating the Future, Together" />
    <meta name="twitter:description" content="Custom software, systems, and technology solutions to help your business thrive in the digital age." />

    <!-- Meta Pixel (2026-08-11) — provided by the team to connect this
         site to Ads Manager (Pixel ID 1074981601694222). Loads
         asynchronously, fires PageView on every page. No app-code
         changes needed — this head snippet covers all routes. -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1074981601694222');
      fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=1074981601694222&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->

    <!-- Pre-paint theme: apply saved dark mode before first render (no flash) -->
    <script>
      try {
        if (localStorage.getItem('inovers-theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>

    <!-- Fonts: Geist (body) + Space Grotesk (display — the space-age voice) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
